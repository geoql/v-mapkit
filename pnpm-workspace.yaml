packages:
  - "packages/*"
  - "apps/*"

# vite-plus 1.x expects `vite` to resolve to its own core
# (@voidzero-dev/vite-plus-core). Every vite / vitest in the graph, Nuxt's
# included, follows the catalog pins below so `vp pack` and `vp test` find the
# copy they were built against.
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

# pnpm blocks all package build scripts by default. The allowBuilds
# map below is security-sensitive — true = postinstall runs; false = skipped.
# Warning: pnpm auto-manages this block. Edits made while pnpm install is
# running may be clobbered. If you see an autogenerated duplicate allowBuilds
# block, remove the duplicate and keep THIS one as source of truth.

allowBuilds:
  "@mongodb-js/zstd": true
  "@parcel/watcher": true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  node-liblzma: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

# Catalogs centralize dependency versions across the monorepo. Sub-packages
# reference these with `catalog:` (default) or `catalog:<name>`. The published
# library (packages/v-mapkit) does NOT use catalogs — npm/yarn/jsr consumers
# don't understand the protocol, so its deps stay real semver. Only the root and
# the apps reference catalogs. Requires pnpm v9.5+ (this repo pins pnpm v12).
catalogs:
  default:
    # Root dev tooling
    "@commitlint/cli": ^21.2.4
    "@commitlint/config-conventional": ^21.2.4
    husky: ^9.1.7
    is-ci: ^4.1.0
    lint-staged: ^17.6.0
    # vite-plus toolchain (overrides above point vite/vitest here)
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vitest: 5.0.5
    vite-plus: 1.4.0
    # Shared by both apps
    nuxt: ^4.6.2
    wrangler: ^4.152.0

  app:docs:
    "@nuxt/scripts": ^1.3.12
    "@openpanel/nuxt": ^0.4.2
    "@iconify-json/simple-icons": ^1.2.100
    "@lucide/vue": ^1.61.0
    "@nuxt/content": ^3.16.2
    "@nuxt/fonts": ^1.1.0
    "@nuxt/icon": ^2.6.1
    "@nuxtjs/color-mode": ^4.0.1
    "@nuxtjs/tailwindcss": 7.0.0-beta.1
    "@resvg/resvg-wasm": ^2.6.2
    "@vueuse/core": ^15.0.0
    "@vueuse/nuxt": ^15.0.0
    better-sqlite3: ^13.0.3
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    nuxt-og-image: ^7.0.7
    oxlint: ^1.89.0
    reka-ui: ^2.11.0
    satori: ^0.63.2
    shadcn-nuxt: ^2.8.2
    tailwind-merge: ^3.7.0
    tailwindcss: ^4.3.3
    tailwindcss-animate: ^1.0.7
    tw-animate-css: ^1.4.0
    typescript: ^6.0.3
    vue: ^3.5.44
    vue-tsc: ^3.3.13

  app:mapkit-cn:
    "@nuxtjs/plausible": ^4.0.0
    "@types/apple-mapkit-js-browser": ^5.78.1
    "@iconify-json/lucide": ^1.2.147
    "@iconify-json/simple-icons": ^1.2.100
    "@nuxt/eslint": ^1.17.0
    "@nuxt/eslint-config": ^1.17.0
    "@nuxt/fonts": ^1.1.0
    "@nuxt/icon": ^2.6.1
    "@nuxtjs/color-mode": ^4.0.1
    # Pinned: only 7.x supports Tailwind v4. Do NOT bump to 6.x.
    "@nuxtjs/tailwindcss": 7.0.0-beta.1
    "@resvg/resvg-wasm": ^2.6.2
    "@tailwindcss/typography": ^0.5.20
    "@vueuse/core": ^15.0.0
    "@vueuse/nuxt": ^15.0.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    eslint: ^10.13.0
    eslint-plugin-better-tailwindcss: ^4.10.0
    eslint-plugin-oxlint: ^1.89.0
    nuxt-og-image: ^7.0.7
    oxlint: ^1.89.0
    reka-ui: ^2.11.0
    satori: ^0.63.2
    shadcn-nuxt: ^2.8.2
    shiki: ^4.5.0
    tailwind-merge: ^3.7.0
    tailwindcss: ^4.3.3
    tailwindcss-animate: ^1.0.7
    tw-animate-css: ^1.4.0
    typescript: ^6.0.3
    vue: ^3.5.44
    vue-tsc: ^3.3.13
